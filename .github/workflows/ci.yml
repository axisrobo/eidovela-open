name: Open CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./conformance/... ./cmd/... ./sdk/...
      - run: go test ./sdk/... -count=1

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build core daemon for the runner
        run: |
          git clone --depth 1 --branch main https://github.com/axisrobo/eidovela.git ../core
          ( cd ../core/backend && go build -o ../../eidovela-open/conformance/bin/eidovelad ./cmd/eidovelad )
      - name: Run the Registry-consumer conformance suite
        run: go test ./conformance/runner/ -run TestFixturesAgainstDaemon -v -count=1
